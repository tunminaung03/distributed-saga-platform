apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        send_batch_size: 256
        timeout: 1s
      transform:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(attributes["service_name"], resource.attributes["service.name"])

    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: "saga_ecosystem"
      
      otlp_grpc/tempo:
        endpoint: tempo.monitoring.svc.cluster.local:4317
        tls:
          insecure: true
      
      # STANDARD OTLP HTTP EXPORTER FOR LOKI 3.x
      otlp_http/loki:
        endpoint: "http://loki.monitoring.svc.cluster.local:3100/otlp"
        tls:
          insecure: true
      debug:
        verbosity: detailed

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, otlp_grpc/tempo]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, otlp_http/loki]