apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets:
              - otel-collector:8889
              
      - job_name: cilium-agent
        static_configs:
          - targets:
              - cilium-agent-metrics.kube-system.svc.cluster.local:9962
              
      - job_name: cilium-envoy
        static_configs:
          - targets:
              - cilium-envoy.kube-system.svc.cluster.local:9964
      - job_name: hubble
        static_configs:
          - targets:
              - hubble-metrics.kube-system.svc.cluster.local:9965