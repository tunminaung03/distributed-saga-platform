apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: health-probes-policy
  namespace: saga-ecosystem

spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: saga-platform

    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - gateway
          - backend
      
  ingress:
    - fromEntities:
        - host # Represents the underlying node/kubelet running the checks
      toPorts:
        - ports: # actuator ports
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
            - port: "8082"
              protocol: TCP
            - port: "8083"
              protocol: TCP
            - port: "8084"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: "^/actuator/health(/liveness|/readiness)?$" # Matches all standard probe variants                