# ===================================================================
# 1. GLOBAL BASELINE FRAMEWORK & BUSINESS PARAMETERS (Shared Across Profiles)
# ===================================================================
server:
  port: ${PAYMENT_SERVICE_PORT:8082} # Default to 8082 if PORT env variable is not set       

spring:
  application:
    name: payment-service
  
  threads:
    virtual:
      enabled: true

  jpa:
    show-sql: false
    properties:
      hibernate:
        format-sql: true
  
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:host.minikube.internal}:${KAFKA_PORT:9092}
  
  # --- Spring cloud Stream configuration for Kafka bindings ---
  cloud:
    function:
      definition: processPayment;compensatePayment
    stream:
      bindings:
        
        # Output channel for outbox  
        publishPaymentOutboxEvents-out-0:
            destination: payment-processed-topic

        # Input channel for receiving events
        processPayment-in-0:
          destination: order-created-topic
          group: payment-group          
          # Local retry strategy
          consumer:
            # Retry with exponential backoff for transient issues (e.g., temporary database outages)
            max-attempts: 3
            back-off-initial-interval: 1000 # Wait 1 second before first retry
            back-off-multiplier: 2.0 # Double the wait time on subsequent retries
        
        # Input channel for receiving compensation events
        compensatePayment-in-0:
          destination: restaurant-rejected-topic
          group: payment-compensation-group          
          consumer:
            max-attempts: 3
            concurrency: 3
            back-off-initial-interval: 1000
            back-off-multiplier: 2.0
                  
      # --- Kafka broker specific binding overrides for Dead Letter Queue (DLQ) configuration ---
      kafka:
        bindings:
          processPayment-in-0:
            consumer:
              enable-dlq: true                            
              dlq-name: order-created-topic.dlq
          compensatePayment-in-0:
            consumer:
              enable-dlq: true
              dlq-name: restaurant-rejected-topic.dlq

        # --- Enables Kafka producer transactions and prevents consumers from reading uncommitted transactions! ---
        binder:
          enable-observation: true # Disables default tracing to allow app custom W3C blocks to control the path
          transaction:
            transaction-id-prefix: payment-tx-
          configuration:
            enable.auto.commit: false
            acks: all
            enable.idempotence: true
            transaction.timeout.ms: 15000 # Closes dead transactional states after 15 seconds
          consumer-properties:
            isolation.level: read_committed
            auto.offset.reset: earliest
            max.poll.interval.ms: 300000 # Gives virtual threads up to 5 minutes to complete batch DB mutations

# ===================================================================
# 2. ACTUATOR & TELEMETRY OBSERVABILITY
# ===================================================================
management:
  endpoint:    
    health:
      show-details: always # Helpful for local debugging to see database/Kafka health
      probes:
        enabled: true # Forces Spring to activate the specific /liveness and /readiness paths

  # Sampling belongs directly under management.tracing in Spring Boot 4
  tracing:
    sampling:
      probability: 1.0

  # Metrics exporter configuration
  otlp:
    metrics:
      export:
        url: "http://${OTEL_COLLECTOR_HOST:otel-collector.monitoring}:4318/v1/metrics"
        
  # OpenTelemetry trace and log endpoints
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: "http://${OTEL_COLLECTOR_HOST:otel-collector.monitoring}:4317"
          transport: grpc          
    logging:
      export:
        otlp:
          endpoint: "http://${OTEL_COLLECTOR_HOST:otel-collector.monitoring}:4317"
          transport: grpc

# ===================================================================
# 3. DIAGNOSTIC LOGGING LEVELS
# ===================================================================
logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.cloud.stream: DEBUG
    org.springframework.cloud.function: DEBUG

# ===================================================================
# 4. CUSTOM APPLICATION BUSINESS LOGIC PROPERTIES
# ===================================================================
app:
  outbox:
    batch-size: ${OUTBOX_BATCHSIZE:10}
    polling-delay-ms: ${OUTBOX_POLLING_DELAYMS:500}
  telemetry:
    tracer-name: ${APP_TRACER_NAME:saga-orchestration-mesh}
  observability:
    ignored:
      paths: /actuator/health,/actuator/info
      tasks: publishNextPaymentOutboxBatch

---
# ===================================================================
# 5. ENVIRONMENT PROFILE: DEFAULT LOCAL IN-MEMORY H2 DATABASE
# ===================================================================
spring:
  config:
    activate:
      on-profile: default # Active if no explicit profile string is supplied on application launch

  datasource:
    # PostgreSQL compatibility mode ensures H2 parses 'FOR UPDATE SKIP LOCKED' (-2) hints smoothly
    url: jdbc:h2:mem:payment_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

---
# ===================================================================
# 6. ENVIRONMENT PROFILE: KUBERNETES DEPLOYED POSTGRESQL DB
# ===================================================================
spring:
  config:
    activate:
      on-profile: k8sdb # Activated by executing with: -Dspring.profiles.active=k8sdb

  datasource:
    # Targets the isolated PostgreSQL schema in your Minikube cluster via the NodePort bridge
    url: jdbc:postgresql://${DATABASE_HOST:172.20.148.189}:${DATABASE_PORT:30432}/saga_db?currentSchema=payment_service_schema
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update