version: '3.8'

services:
  # ===================================================================
  # 💾 CENTRAL PERSISTENCE PLANE (MIRRORS PRODUCTION-GRADE POSTGRES:18)
  # ===================================================================
  postgres-db:
    image: postgres:18-alpine
    container_name: local-postgres-db
    ports:
      - "5432:5432" # Allows local IDE app profiles to connect on loopback
    environment:
      - POSTGRES_DB=saga_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      # Automatically executes your idempotent init script to provision the 4 distinct logical schemas
      - ./manifests/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ===================================================================
  # 🔀 EVENT DRIVEN MESSAGING BUS (BARE-METAL DUAL EXTERNAL LISTENERS)
  # ===================================================================
  kafka-broker:
    image: confluentinc/cp-kafka:7.8.0
    container_name: local-kraft-kafka
    ports:
      - "9092:9092" # Internal Docker communication socket mapping
      - "9094:9094" # External host loopback interface target socket mapping
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-broker:9092,EXTERNAL://host.minikube.internal:9094'
      KAFKA_OFFERS_LIST_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker:9093'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk' # Fixed static runtime cryptographic signature
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  # ===================================================================
  # 📊 OBSERVABILITY PILLARS INGESTION BRIDGE (PORT-FORWARD SIMULATOR)
  # ===================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: local-otel-collector
    ports:
      - "4317:4317" # Binary gRPC stream receiver (Traces and Logs)
      - "4318:4318" # HTTP/1.1 REST metrics exporter landing receiver
    volumes:
      # Maps to the centralized manifest structure configuration
      - ./manifests/lgtm-monitoring-stack.yaml:/etc/otelcol-contrib/config.yaml
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - prometheus
      - loki
      - tempo

  # ===================================================================
  # 📈 OPTIMIZED BACKGROUND RECORD STORAGE ENGINES
  # ===================================================================
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: local-prometheus
    ports:
      - "9095:9095" # Custom endpoint configuration avoiding conflict spaces
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      # Repaired target directory mapping to point directly inside centralized manifests
      - ./manifests/lgtm-monitoring-stack.yaml:/etc/prometheus/prometheus.yml

  loki:
    image: grafana/loki:3.2.0
    container_name: local-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  tempo:
    image: grafana/tempo:2.6.0
    container_name: local-tempo
    ports:
      - "3200:3200"
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./manifests/lgtm-monitoring-stack.yaml:/etc/tempo/tempo.yaml

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: local-grafana
    ports:
      - "3000:3000" # Maps dashboards to browser context
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - prometheus
      - loki
      - tempo