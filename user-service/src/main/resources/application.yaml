# ===================================================================
# 1. GLOBAL BASELINE FRAMEWORK & BUSINESS PARAMETERS (Shared Across Profiles)
# ===================================================================
server:
  port: ${USER_SERVICE_PORT:8084} # Default to 8080 if PORT env variable is not set


spring:
  application:
    name: user-service
  
  # -- ADDED: Spring Boot 4 Virtual Threads Configuration for gRPC Blocking Calls ---
  threads:
    virtual:
      enabled: true # Optimizes processing with Spring Boot 4 Virtual Threads

  sql:
    init:
      mode: always # Forces data.sql script execution on context initialization

  jpa:
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format-sql: true

  grpc:
    server:
      port: ${GRPC_PORT:9090}
      host: ${USER_SERVICE_GRPC_HOST:127.0.0.1}

# ===================================================================
# 2. ACTUATOR & TELEMETRY OBSERVABILITY
# ===================================================================
# -- ADDED: Spring Boot Actuator Health Endpoint Configuration for Debugging --
management:
  endpoint:    
    health:
      show-details: always # Helpful for local debugging to see database/Kafka health
      probes:
        enabled: true # Forces Spring to activate the specific /liveness and /readiness paths

  # Sampling belongs directly under management.tracing in Spring Boot 4
  tracing:
    sampling:
      probability: 1.0
      
  # Metrics exporter configuration
  otlp:
    metrics:
      export:
        url: "http://${OTEL_COLLECTOR_HOST:otel-collector.monitoring}:4318/v1/metrics"        
        
  # OpenTelemetry trace and log endpoints
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: "http://${OTEL_COLLECTOR_HOST:otel-collector.monitoring}:4317"
          transport: grpc # Enforces the binary stream transport
    logging:
      export:
        otlp:
          endpoint: "http://${OTEL_COLLECTOR_HOST:otel-collector.monitoring}:4317"
          transport: grpc # Enforces the binary stream transport    

# ===================================================================
# 3. DIAGNOSTIC LOGGING LEVELS
# ===================================================================
logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.grpc: DEBUG

# ===================================================================
# 4. CUSTOM APPLICATION BUSINESS LOGIC PROPERTIES
# ===================================================================
app:
  jwt:
    secret: ${JWT_SECRET:d1303506942c7801d01a484919889d7a05921d66896a8938e4ffe40ecf35f34e}
    issuer: ${JWT_ISSUER:saga-ecosystem-auth}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  observability:
    ignored:
      paths: /actuator/health,/actuator/info

---
# ===================================================================
# 5. ENVIRONMENT PROFILE: DEFAULT LOCAL IN-MEMORY H2 DATABASE
# ===================================================================
spring:
  config:
    activate:
      on-profile: default # Active if no explicit profile string is supplied on application launch

  datasource:
    # PostgreSQL compatibility mode ensures H2 parses 'FOR UPDATE SKIP LOCKED' (-2) hints smoothly
    url: jdbc:h2:mem:user_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

---
# ===================================================================
# 6. ENVIRONMENT PROFILE: KUBERNETES DEPLOYED POSTGRESQL DB
# ===================================================================
spring:
  config:
    activate:
      on-profile: k8sdb # Activated by executing with: -Dspring.profiles.active=k8sdb

  datasource:
    # Targets the isolated PostgreSQL schema in your Minikube cluster via the NodePort bridge
    url: jdbc:postgresql://${DATABASE_HOST:172.20.148.189}:${DATABASE_PORT:30432}/saga_db?currentSchema=user_service_schema
    driver-class-name: org.postgresql.Driver    
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update